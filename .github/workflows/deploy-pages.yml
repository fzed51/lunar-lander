name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - packages/engine/**
      - packages/game/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Installe Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Active corepack (yarn 4)
        run: corepack enable

      - name: Installe les dépendances
        run: yarn install --immutable

      - name: Vérifie les types et les tests
        run: yarn typecheck && yarn test

      - name: Construit le jeu
        run: yarn build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Prépare l'artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploie sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
